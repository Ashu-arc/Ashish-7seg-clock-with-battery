; Ashish 7seg clock with battery - build environments for WLED v0.14.4
; 6d = 6 digits (HH:MM:SS), 4d = 4 digits (HH:MM)
; PIXEL_COUNTS = start LED count: 6d = 53 (6x7 + 2x2 colon + 7 weekdays), 4d = 37 (4x7 + 1x2 colon + 7 weekdays)
; ABL_MILLIAMPS_DEFAULT = LED power limit 2000 mA

[env:ashish_bat_6d_esp8266]
extends = env:nodemcuv2
build_flags = ${env:nodemcuv2.build_flags} -D USERMOD_ASHISH_CLOCK7SEG_BAT -D PIXEL_COUNTS=53 -D ABL_MILLIAMPS_DEFAULT=2000

[env:ashish_bat_6d_esp32]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -D USERMOD_ASHISH_CLOCK7SEG_BAT -D PIXEL_COUNTS=53 -D ABL_MILLIAMPS_DEFAULT=2000

[env:ashish_bat_4d_esp8266]
extends = env:nodemcuv2
build_flags = ${env:nodemcuv2.build_flags} -D USERMOD_ASHISH_CLOCK7SEG_BAT -D CLOCK_4_DIGIT -D PIXEL_COUNTS=37 -D ABL_MILLIAMPS_DEFAULT=2000

[env:ashish_bat_4d_esp32]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -D USERMOD_ASHISH_CLOCK7SEG_BAT -D CLOCK_4_DIGIT -D PIXEL_COUNTS=37 -D ABL_MILLIAMPS_DEFAULT=2000
